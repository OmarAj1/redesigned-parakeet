name: Database Enrichment
on: [workflow_dispatch] # Adds a "Run workflow" button in the GitHub Actions tab

jobs:
  enrich-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Enrichment Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python enricher.py
          
      - name: Save Updated Database
        uses: actions/upload-artifact@v4
        with:
          name: enriched-database
          path: MasterUnifiedDB.db